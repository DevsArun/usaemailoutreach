# Render Blueprint — Auto-configures all services
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: leadforge-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "7860"
      - key: DATABASE_URL
        fromDatabase:
          name: leadforge-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY_1
        sync: false

databases:
  - name: leadforge-db
    plan: free
    databaseName: leadforge_db
    user: leadforge
