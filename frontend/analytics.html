<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — LeadForge AI</title>
  <meta name="description" content="Visual analytics and insights for your outreach campaigns, lead scores, and pipeline performance.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/custom.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <main class="main-content" id="mainContent">
      <!-- Header -->
      <div class="top-header">
        <div class="page-title-section">
          <h1>Analytics</h1>
          <p>Insights and performance metrics across your campaigns.</p>
        </div>
        <div class="header-actions">
          <select class="form-select" id="analyticsCampaignFilter" style="width:200px;padding:0.5rem 2rem 0.5rem 0.75rem;">
            <option value="">All Campaigns</option>
          </select>
          <button class="btn btn-secondary btn-sm" id="refreshAnalytics">🔄 Refresh</button>
        </div>
      </div>

      <!-- Overview Stats -->
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
        <div class="glass-card-static p-4 text-center">
          <div style="font-size:0.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Leads</div>
          <div style="font-size:1.35rem;font-weight:800;margin-top:0.25rem;" id="analyticLeads">0</div>
        </div>
        <div class="glass-card-static p-4 text-center">
          <div style="font-size:0.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Emails</div>
          <div style="font-size:1.35rem;font-weight:800;margin-top:0.25rem;color:var(--primary-light);" id="analyticEmails">0</div>
        </div>
        <div class="glass-card-static p-4 text-center">
          <div style="font-size:0.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Open Rate</div>
          <div style="font-size:1.35rem;font-weight:800;margin-top:0.25rem;color:var(--accent-light);" id="analyticOpenRate">0</div>
        </div>
        <div class="glass-card-static p-4 text-center">
          <div style="font-size:0.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Reply Rate</div>
          <div style="font-size:1.35rem;font-weight:800;margin-top:0.25rem;color:var(--success);" id="analyticReplyRate">0</div>
        </div>
        <div class="glass-card-static p-4 text-center">
          <div style="font-size:0.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Conversion</div>
          <div style="font-size:1.35rem;font-weight:800;margin-top:0.25rem;color:var(--warning);" id="analyticConversion">0</div>
        </div>
        <div class="glass-card-static p-4 text-center">
          <div style="font-size:0.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Meetings</div>
          <div style="font-size:1.35rem;font-weight:800;margin-top:0.25rem;color:#14b8a6;" id="analyticMeetings">0</div>
        </div>
      </div>

      <!-- Charts Grid -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <!-- Emails Over Time -->
        <div class="glass-card-static p-5">
          <h3 style="font-size:0.95rem;font-weight:700;margin-bottom:1rem;">📈 Emails Sent Over Time</h3>
          <div class="chart-container" style="height:280px;">
            <canvas id="emailsOverTimeChart"></canvas>
          </div>
        </div>

        <!-- Open vs Reply Rate by Campaign -->
        <div class="glass-card-static p-5">
          <h3 style="font-size:0.95rem;font-weight:700;margin-bottom:1rem;">📊 Open Rate vs Reply Rate</h3>
          <div class="chart-container" style="height:280px;">
            <canvas id="openReplyRateChart"></canvas>
          </div>
        </div>

        <!-- Lead Sources -->
        <div class="glass-card-static p-5">
          <h3 style="font-size:0.95rem;font-weight:700;margin-bottom:1rem;">🎯 Lead Sources Distribution</h3>
          <div class="chart-container" style="height:280px;">
            <canvas id="leadSourcesChart"></canvas>
          </div>
        </div>

        <!-- Score Distribution -->
        <div class="glass-card-static p-5">
          <h3 style="font-size:0.95rem;font-weight:700;margin-bottom:1rem;">📉 Lead Score Distribution</h3>
          <div class="chart-container" style="height:280px;">
            <canvas id="scoreDistChart"></canvas>
          </div>
        </div>
      </div>

      <!-- Funnel Chart (Full Width) -->
      <div class="glass-card-static p-5">
        <h3 style="font-size:0.95rem;font-weight:700;margin-bottom:1rem;">🔄 Pipeline Stage Conversion Funnel</h3>
        <div class="chart-container" style="height:360px;">
          <canvas id="funnelChart"></canvas>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/analytics.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('sidebarContainer').innerHTML = getSidebarHTML();
      App.init();
      Analytics.init();
    });
  </script>
</body>
</html>
