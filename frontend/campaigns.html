<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaigns — LeadForge AI</title>
  <meta name="description" content="Manage your lead discovery campaigns. Create, start, pause, and monitor campaign progress.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>
  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <main class="main-content" id="mainContent">
      <!-- Header -->
      <div class="top-header">
        <div class="page-title-section">
          <h1>Campaigns</h1>
          <p>Create and manage your lead discovery campaigns.</p>
        </div>
        <div class="header-actions">
          <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Search campaigns..." id="campaignSearch">
          </div>
          <select class="form-select" id="campaignStatusFilter" style="width:140px;padding:0.5rem 2rem 0.5rem 0.75rem;">
            <option value="">All Status</option>
            <option value="draft">Draft</option>
            <option value="running">Running</option>
            <option value="active">Active</option>
            <option value="paused">Paused</option>
            <option value="stopped">Stopped</option>
            <option value="completed">Completed</option>
          </select>
          <button class="btn btn-primary" onclick="Modal.open('createCampaignModal')">+ New Campaign</button>
        </div>
      </div>

      <!-- Campaigns Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4" id="campaignsList">
        <!-- Populated by JS -->
      </div>
    </main>
  </div>

  <!-- Create Campaign Modal -->
  <div class="modal-overlay" id="createCampaignModal">
    <div class="modal" style="max-width:520px;">
      <div class="modal-header">
        <h3>🚀 Create New Campaign</h3>
        <button class="modal-close">✕</button>
      </div>
      <form id="createCampaignForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="campQuery">Search Query *</label>
            <input type="text" id="campQuery" class="form-input" placeholder='e.g. "Digital marketing agencies", "Law firms"' required>
            <div style="font-size:0.7rem;color:var(--text-muted);margin-top:0.25rem;">Enter the type of business you want to find</div>
          </div>
          <div class="form-group">
            <label class="form-label" for="campLocation">Location</label>
            <input type="text" id="campLocation" class="form-input" placeholder="e.g. New York, NY or United States">
          </div>
          <div class="form-group">
            <label class="form-label" for="campMaxLeads">Max Leads</label>
            <input type="number" id="campMaxLeads" class="form-input" value="50" min="1" max="500">
          </div>
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <label class="toggle">
              <input type="checkbox" id="campAutoEmail">
              <span class="toggle-slider"></span>
            </label>
            <div>
              <div style="font-size:0.82rem;font-weight:600;">Auto-generate Emails</div>
              <div style="font-size:0.7rem;color:var(--text-muted);">Automatically create outreach emails for discovered leads</div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="Modal.close('createCampaignModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">🚀 Create Campaign</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Campaign Detail Modal -->
  <div class="modal-overlay" id="campaignDetailModal">
    <div class="modal" style="max-width:520px;">
      <div class="modal-header">
        <h3>Campaign Details</h3>
        <button class="modal-close">✕</button>
      </div>
      <div class="modal-body" id="campaignDetailBody">
        <!-- Populated by JS -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="Modal.close('campaignDetailModal')">Close</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/campaigns.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('sidebarContainer').innerHTML = getSidebarHTML();
      App.init();
      Campaigns.init();
    });
  </script>
</body>
</html>
